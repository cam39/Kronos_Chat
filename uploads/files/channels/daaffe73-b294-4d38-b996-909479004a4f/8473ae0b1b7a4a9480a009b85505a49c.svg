<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="kroniGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#kroniGrad)" stroke="#ccff00" stroke-width="2"/>
  
  <!-- AI Brain icon -->
  <g fill="#ccff00" filter="url(#glow)">
    <!-- Central node -->
    <circle cx="50" cy="50" r="12"/>
    <!-- Connection lines -->
    <line x1="50" y1="50" x2="50" y2="25" stroke="#ccff00" stroke-width="2"/>
    <line x1="50" y1="50" x2="71" y2="42" stroke="#ccff00" stroke-width="2"/>
    <line x1="50" y1="50" x2="71" y2="58" stroke="#ccff00" stroke-width="2"/>
    <line x1="50" y1="50" x2="50" y2="75" stroke="#ccff00" stroke-width="2"/>
    <line x1="50" y1="50" x2="29" y2="58" stroke="#ccff00" stroke-width="2"/>
    <line x1="50" y1="50" x2="29" y2="42" stroke="#ccff00" stroke-width="2"/>
    <!-- Outer nodes -->
    <circle cx="50" cy="25" r="5"/>
    <circle cx="71" cy="42" r="5"/>
    <circle cx="71" cy="58" r="5"/>
    <circle cx="50" cy="75" r="5"/>
    <circle cx="29" cy="58" r="5"/>
    <circle cx="29" cy="42" r="5"/>
  </g>
  
  <!-- Decorative ring -->
  <circle cx="50" cy="50" r="46" fill="none" stroke="#ccff00" stroke-width="1" opacity="0.5"/>
</svg>
